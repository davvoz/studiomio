# What every build of the app needs: Node with the dependencies, Rust with wasm-pack and the
# DSP compiled to WebAssembly (for the app and for the tests the typecheck reads).
name: setup
description: Node, Rust, wasm-pack, npm ci and the WebAssembly DSP

runs:
  using: composite
  steps:
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 22
        cache: npm

    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        targets: wasm32-unknown-unknown

    - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
      with:
        tool: wasm-pack

    # no dependency's install scripts run (supply-chain safety): none is needed, electron-builder
    # downloads Electron itself and the Windows installer is NSIS, not Squirrel (electron-winstaller)
    - shell: bash
      run: npm ci --ignore-scripts
    - shell: bash
      run: npm run wasm
    # needed even without tests: the typecheck in npm run build checks the tests, which import it
    - shell: bash
      run: npm run wasm:test
