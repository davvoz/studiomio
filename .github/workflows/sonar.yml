# SonarCloud at every push to main (and on pull requests): the analysis with the tests' coverage.
# Separate from the release: whatever it finds, it never stops a build.
name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # the whole history: SonarCloud knows what's new

      - uses: ./.github/actions/setup

      # the speed tests are skipped (instrumented code is slower); a failing test doesn't stop the
      # analysis, the coverage report is written anyway
      - run: npm run coverage
        continue-on-error: true

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
