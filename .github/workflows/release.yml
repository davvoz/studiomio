# Publishes a release when a version tag is pushed:
#   npm version minor        (0.1.0 → 0.2.0: commit + tag v0.2.0)
#   git push --follow-tags
# Installed apps find it on their next start and offer the update.
# Windows builds, tests and creates the release; Linux then adds its packages to it.
name: release

on:
  push:
    tags: ['v*']

# nothing by default: each job asks only for what it needs
permissions: {}

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # to create the release and upload the installer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: ./.github/actions/setup

      # a release with broken tests must not reach users; an urgent fix can skip them
      # with "[skip tests]" in the version commit message (release.bat patch notest)
      - if: ${{ !contains(github.event.head_commit.message, '[skip tests]') }}
        run: npm test

      - run: npm run build
      - run: npm run electron:build
      - run: npx electron-builder --win --publish never

      # the release is created in one go with all the files: electron-builder uploaded them in
      # parallel and created two per tag (or a half one, without latest.yml for updates).
      # The text is the version's section in CHANGELOG.md. The copy with the fixed name is for the
      # README's direct link (releases/latest/download/studiomio-setup.exe); updates
      # use the one with the version, written in latest.yml.
      - shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          node scripts/changelog.mjs notes "$v" > release-notes.md
          cp "release/studiomio-setup-$v.exe" release/studiomio-setup.exe
          gh release create "$GITHUB_REF_NAME" --title "$v" --notes-file release-notes.md \
            "release/studiomio-setup-$v.exe" "release/studiomio-setup-$v.exe.blockmap" release/latest.yml \
            release/studiomio-setup.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After windows: its tests gate the release too, and the release already exists. If this job fails
  # the Windows release stays out; rerun the job from Actions to add the Linux files.
  linux:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to upload the Linux packages to the release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup

      - run: npm run build
      - run: npm run electron:build
      - run: npx electron-builder --linux --publish never

      # latest-linux.yml is what the AppImage reads to update itself; the copies with the fixed
      # name are for the README's direct links.
      - run: |
          v="${GITHUB_REF_NAME#v}"
          cp "release/studiomio-$v.AppImage" release/studiomio.AppImage
          cp "release/studiomio-$v.deb" release/studiomio.deb
          gh release upload "$GITHUB_REF_NAME" --clobber release/latest-linux.yml             "release/studiomio-$v.AppImage" "release/studiomio-$v.deb"             release/studiomio.AppImage release/studiomio.deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
