# Publishes a release when a version tag is pushed:
#   npm version minor        (0.1.0 → 0.2.0: commit + tag v0.2.0)
#   git push --follow-tags
# Installed apps find it on their next start and offer the update.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # to create the release and upload the installer

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: wasm-pack

      - run: npm ci
      - run: npm run wasm
      # needed even without tests: the typecheck in npm run build checks the tests, which import it
      - run: npm run wasm:test

      # a release with broken tests must not reach users; an urgent fix can skip them
      # with "[skip tests]" in the version commit message (release.bat patch notest)
      - if: ${{ !contains(github.event.head_commit.message, '[skip tests]') }}
        run: npm test

      - run: npm run build
      - run: npm run electron:build
      - run: npx electron-builder --win --publish never

      # the release is created in one go with all the files: electron-builder uploaded them in
      # parallel and created two per tag (or a half one, without latest.yml for updates).
      # The text is the version's section in CHANGELOG.md. The copy with the fixed name is for the
      # README's direct link (releases/latest/download/studiomio-setup.exe); updates
      # use the one with the version, written in latest.yml.
      - shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          node scripts/changelog.mjs notes "$v" > release-notes.md
          cp "release/studiomio-setup-$v.exe" release/studiomio-setup.exe
          gh release create "$GITHUB_REF_NAME" --title "$v" --notes-file release-notes.md \
            "release/studiomio-setup-$v.exe" "release/studiomio-setup-$v.exe.blockmap" release/latest.yml \
            release/studiomio-setup.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
