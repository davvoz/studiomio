<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-label="studiomio: compose, warp, play it live">
  <style>
    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: beat 1.8s ease-in-out infinite alternate; }
    .b2 { animation-delay: -.5s; animation-duration: 1.4s; }
    .b3 { animation-delay: -1.1s; animation-duration: 2.1s; }
    .b4 { animation-delay: -.2s; animation-duration: 1.6s; }
    .b5 { animation-delay: -.9s; animation-duration: 1.3s; }
    .b6 { animation-delay: -1.5s; animation-duration: 1.9s; }
    @keyframes beat { from { transform: scaleY(.55); } to { transform: scaleY(1.06); } }
    .playhead { animation: play 14s linear infinite; }
    @keyframes play { from { transform: translateX(0); } to { transform: translateX(1280px); } }
    @media (prefers-reduced-motion: reduce) { .bar, .playhead { animation: none; } }
  </style>
  <defs>
    <clipPath id="card"><rect width="1280" height="420" rx="22"/></clipPath>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2127"/><stop offset="1" stop-color="#101215"/>
    </linearGradient>
    <radialGradient id="warm" cx=".83" cy=".42" r=".42">
      <stop offset="0" stop-color="#ff9d2e" stop-opacity=".17"/><stop offset="1" stop-color="#ff9d2e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#glow)"/>
    <rect width="1280" height="420" fill="url(#warm)"/>
