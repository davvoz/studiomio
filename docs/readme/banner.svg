<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-label="studiomio: compose, warp, play it live">
  <style>
    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: beat 1.8s ease-in-out infinite alternate; }
    .b2 { animation-delay: -.5s; animation-duration: 1.4s; }
    .b3 { animation-delay: -1.1s; animation-duration: 2.1s; }
    .b4 { animation-delay: -.2s; animation-duration: 1.6s; }
    .b5 { animation-delay: -.9s; animation-duration: 1.3s; }
    .b6 { animation-delay: -1.5s; animation-duration: 1.9s; }
    @keyframes beat { from { transform: scaleY(.55); } to { transform: scaleY(1.06); } }
    .playhead { animation: play 14s linear infinite; }
    @keyframes play { from { transform: translateX(0); } to { transform: translateX(1280px); } }
    @media (prefers-reduced-motion: reduce) { .bar, .playhead { animation: none; } }
  </style>
  <defs>
    <clipPath id="card"><rect width="1280" height="420" rx="22"/></clipPath>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2127"/><stop offset="1" stop-color="#101215"/>
    </linearGradient>
    <radialGradient id="warm" cx=".83" cy=".42" r=".42">
      <stop offset="0" stop-color="#ff9d2e" stop-opacity=".17"/><stop offset="1" stop-color="#ff9d2e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#glow)"/>
    <rect width="1280" height="420" fill="url(#warm)"/>
    <path d="M80 0V420M160 0V420M240 0V420M320 0V420M400 0V420M480 0V420M560 0V420M640 0V420M720 0V420M800 0V420M880 0V420M960 0V420M1040 0V420M1120 0V420M1200 0V420" stroke="#fff" stroke-opacity=".035"/>

    <!-- the wordmark: the two o's are knobs -->
    <g transform="translate(84 112) scale(.74)" fill="none" stroke="#e8eaee" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
      <path d="M56 20C48 4 14 0 8 22C2 50 56 46 56 76C56 104 14 106 4 84"/>
      <g transform="translate(90)"><path d="M18 -34V70Q18 100 46 98M0 4H46"/></g>
      <g transform="translate(168)"><path d="M4 0V56C4 111 72 111 72 56M72 0V98"/></g>
      <g transform="translate(272)"><circle cx="44" cy="50" r="45"/><path d="M89 -42V98"/></g>
      <g transform="translate(400)"><path d="M0 0V98"/><circle cx="0" cy="-34" r="13" fill="#ff9d2e" stroke="none"/></g>
      <g transform="translate(430)">
        <path d="M16.3 79.7A42 42 0 1 1 75.7 79.7" stroke="#59616d"/>
        <path d="M16.3 79.7A42 42 0 1 1 82.4 29" stroke="#ff9d2e"/>
        <path d="M50 47L66 38.500" stroke-width="13"/>
      </g>
      <g transform="translate(556)"><path d="M4 98V0M4 40C4 -13 54 -13 54 40V98M54 40C54 -13 104 -13 104 40V98"/></g>
      <g transform="translate(694)"><path d="M0 0V98"/><circle cx="0" cy="-34" r="13" fill="#ff9d2e" stroke="none"/></g>
      <g transform="translate(724)">
        <path d="M16.3 79.7A42 42 0 1 1 75.7 79.7" stroke="#59616d"/>
        <path d="M16.3 79.7A42 42 0 0 1 31.6 10.500" stroke="#ff9d2e"/>
        <path d="M43 45L36 28" stroke-width="13"/>
      </g>
    </g>

    <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
      <text x="86" y="252" font-size="33" font-weight="600" fill="#e8eaee">Compose. Warp. Play it live.</text>
      <text x="86" y="290" font-size="21" fill="#9aa0aa">A digital audio workstation with session and arrangement views,</text>
      <text x="86" y="318" font-size="21" fill="#9aa0aa">nine instruments of its own and no plugins to install.</text>
    </g>

    <!-- the icon's bars, playing -->
    <g transform="translate(912 62)" fill="#ff9d2e">
      <rect class="bar" x="0" y="146" width="36" height="86" rx="9"/>
      <rect class="bar b2" x="54" y="72" width="36" height="160" rx="9"/>
      <rect class="bar b3" x="108" y="116" width="36" height="116" rx="9"/>
      <rect class="bar b4" x="162" y="32" width="36" height="200" rx="9"/>
      <rect class="bar b5" x="216" y="94" width="36" height="138" rx="9"/>
      <rect class="bar b6" x="270" y="164" width="36" height="68" rx="9"/>
      <rect x="-8" y="246" width="322" height="9" rx="4.500" opacity=".55"/>
    </g>

    <!-- clips on three tracks, and the playhead -->
    <g>
      <g fill="#f03c46"><rect x="0" y="352" width="318" height="16" rx="3"/><rect x="322" y="352" width="318" height="16" rx="3"/><rect x="644" y="352" width="318" height="16" rx="3" opacity=".75"/><rect x="966" y="352" width="314" height="16" rx="3"/></g>
      <g fill="#00c98d"><rect x="160" y="373" width="238" height="16" rx="3"/><rect x="402" y="373" width="238" height="16" rx="3" opacity=".75"/><rect x="724" y="373" width="398" height="16" rx="3"/></g>
      <g><rect x="0" y="394" width="158" height="16" rx="3" fill="#9a5cff"/><rect x="322" y="394" width="238" height="16" rx="3" fill="#00b4e6"/><rect x="564" y="394" width="158" height="16" rx="3" fill="#ffd60a"/><rect x="884" y="394" width="238" height="16" rx="3" fill="#ff3c82"/><rect x="1126" y="394" width="154" height="16" rx="3" fill="#9a5cff"/></g>
    </g>
    <path class="playhead" d="M0 344V420" stroke="#fff" stroke-width="2" stroke-opacity=".9"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="419" rx="21.500" fill="none" stroke="#2c3138"/>
</svg>
