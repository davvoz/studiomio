# SonarCloud, analysed from CI (.github/workflows/sonar.yml) with the tests' coverage.
sonar.organization=davvoz
sonar.projectKey=davvoz_studiomio

sonar.sources=src,electron,scripts
sonar.tests=tests
# generated by wasm-pack; the frozen legacy implementation the DSP equivalence tests compare against
sonar.exclusions=src/dsp/wasm/pkg/**
sonar.test.exclusions=tests/reference/**,tests/wasm-pkg/**

# written by npm run coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# not covered by unit tests on purpose: check-startup.mjs is itself a test (it launches the packaged
# app in the release build), main.ts is the Electron entry point it starts, bench.ts is the
# developers' DSP bench page (bench.html), not part of the app
sonar.coverage.exclusions=scripts/check-startup.mjs,electron/main.ts,src/bench.ts
