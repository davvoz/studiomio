# Installer Windows di studiomio (npm run dist → release/).
appId: it.davvoz.studiomio
productName: studiomio
copyright: Copyright © 2026 David

directories:
  buildResources: build   # icon.png
  output: release

# Only the compiled app and the main process go in the package; the test bench doesn't.
files:
  - dist/**
  - "!dist/bench.html"
  - "!dist/assets/bench-*"
  - dist-electron/**
  - package.json

win:
  target: nsis
  artifactName: studiomio-setup-${version}.${ext}

# Per-user install, without questions or administrator rights.
nsis:
  oneClick: true
  perMachine: false
  shortcutName: studiomio
  createDesktopShortcut: always
  createStartMenuShortcut: true

# Updates are downloaded from the repository's releases.
publish:
  provider: github
  owner: davvoz
  repo: studiomio
  releaseType: release
